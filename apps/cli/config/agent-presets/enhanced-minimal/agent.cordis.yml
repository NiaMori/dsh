# The `enhanced-minimal` agent preset: the minimal two-tool coding agent, plus
# two minimal context-only plugins that add no tools and no prompt sections.
#
# The persona is copied verbatim from `minimal` — the complete system prompt,
# no runtime context snapshots, no appended prompt sections. The model keeps
# exactly the two minimal tools (`persistent-bash` and `str_replace_editor`).
#
# The added rows only inject short user-message hints:
# - `agent-instructions-minimal` reminds the model once, after the first direct
#   user prompt, to look for AGENTS.md / skills directories and ~/.agents.
# - `skill-minimal` keeps the web UI `/name` slash-command gesture and appends
#   only the selected skill's file address instead of loading its content.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# Minimal orientation reminder after the first direct user prompt: look for
# AGENTS.md / skills directories and ~/.agents. No tools, no prompt sections.
- id: agent-instructions-minimal
  name: '@deepseek-ai/dsh-agent-instructions-minimal'

# Minimal skill slash-command handler: keeps the web UI `/name` gesture and
# injects only the skill file address. No model-facing tool is registered.
- id: skill-minimal
  name: '@deepseek-ai/dsh-skill-minimal'

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
